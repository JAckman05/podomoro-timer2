<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer Elegant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #f8fafc;
        }
        .elegant-shadow {
            box-shadow: 0 20px 40px -15px rgba(15, 23, 42, 0.06);
        }
        .inner-glow {
            box-shadow: inset 0 2px 4px 0 rgba(255, 255, 255, 0.8);
        }
    </style>
</head>
<body class="min-h-screen text-slate-700 bg-slate-50 flex flex-col justify-between antialiased">

    <main class="w-full max-w-5xl mx-auto px-6 py-12 flex-grow flex flex-col justify-center items-center gap-12">
        
        <div class="w-full flex justify-between items-center max-w-4xl">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-rose-500 to-orange-400 flex items-center justify-center shadow-md shadow-rose-500/20">
                    <i class="fa-regular fa-clock text-white text-lg"></i>
                </div>
                <span class="text-xl font-extrabold tracking-tight text-slate-800">Podomoro.</span>
            </div>
            <div class="flex gap-2">
                <button class="w-10 h-10 rounded-xl bg-white text-slate-400 hover:text-slate-600 border border-slate-200/60 flex items-center justify-center transition-all shadow-sm" title="Statistik">
                    <i class="fa-solid fa-chart-bar text-sm"></i>
                </button>
                <button class="w-10 h-10 rounded-xl bg-white text-slate-400 hover:text-slate-600 border border-slate-200/60 flex items-center justify-center transition-all shadow-sm" title="Pengaturan">
                    <i class="fa-solid fa-sliders text-sm"></i>
                </button>
            </div>
        </div>

        <div class="w-full max-w-4xl grid grid-cols-1 md:grid-cols-12 gap-8 items-center">
            
            <div class="md:col-span-6 flex flex-col items-center">
                <div class="bg-white border border-slate-200/80 p-1 rounded-2xl flex gap-1 mb-10 shadow-sm w-full max-w-xs">
                    <button id="m-pomo" class="flex-1 py-2 text-xs font-medium rounded-xl text-slate-500 hover:text-slate-800 transition-all">🍅 Pomodoro</button>
                    <button id="m-short" class="flex-1 py-2 text-xs font-bold rounded-xl bg-emerald-50 text-emerald-600 border border-emerald-100 shadow-sm transition-all">☕ Short Break</button>
                    <button id="m-long" class="flex-1 py-2 text-xs font-medium rounded-xl text-slate-500 hover:text-slate-800 transition-all">🌴 Long Break</button>
                </div>

                <div class="relative w-72 h-72 flex items-center justify-center mb-8">
                    <svg class="absolute inset-0 w-full h-full -rotate-90">
                        <circle cx="50%" cy="50%" r="44%" stroke="#e2e8f0" stroke-width="5" fill="transparent" stroke-dasharray="10 5" class="opacity-40" />
                        <circle id="ring-progress" cx="50%" cy="50%" r="44%" stroke="#10b981" stroke-width="6" fill="transparent" 
                                stroke-dasharray="792" stroke-dashoffset="198" stroke-linecap="round" class="transition-all duration-300" />
                    </svg>
                    <div class="text-center z-10">
                        <span id="display-time" class="text-6xl font-black text-slate-800 block tracking-tighter tabular-nums">05:00</span>
                        <span id="display-label" class="text-[10px] uppercase tracking-widest font-bold text-emerald-500 mt-2 block">Istirahat Pendek</span>
                    </div>
                </div>

                <div class="flex items-center gap-5">
                    <button class="w-12 h-12 rounded-xl bg-white border border-slate-200/60 hover:bg-slate-50 text-slate-400 hover:text-slate-600 flex items-center justify-center transition-all shadow-sm"><i class="fa-solid fa-rotate-left text-sm"></i></button>
                    <button class="px-8 py-3.5 rounded-2xl bg-emerald-500 hover:bg-emerald-600 text-white font-bold shadow-lg shadow-emerald-500/20 active:scale-95 transition-all flex items-center gap-2 text-sm"><i class="fa-solid fa-play"></i> Mulai</button>
                    <button class="w-12 h-12 rounded-xl bg-white border border-slate-200/60 hover:bg-slate-50 text-slate-400 hover:text-slate-600 flex items-center justify-center transition-all shadow-sm"><i class="fa-solid fa-forward text-sm"></i></button>
                </div>
            </div>

            <div class="md:col-span-6">
                <div class="bg-white border border-slate-200/60 rounded-3xl p-6 md:p-8 elegant-shadow min-h-[340px] flex flex-col justify-between">
                    <div>
                        <div class="flex justify-between items-center mb-6">
                            <h3 class="text-sm font-bold text-slate-800 flex items-center gap-2"><i class="fa-solid fa-list-check text-slate-400"></i> Daftar Tugas</h3>
                            <span class="text-[11px] bg-slate-100 text-slate-500 font-medium px-2.5 py-0.5 rounded-full">0 selesai</span>
                        </div>
                        <p class="text-xs text-slate-400 mb-8 font-medium">Apa fokus Anda berikutnya?</p>
                    </div>

                    <div class="flex-grow flex flex-col items-center justify-center text-center py-8">
                        <div class="w-8 h-8 rounded-lg bg-slate-50 border border-slate-200/60 flex items-center justify-center mb-3 shadow-sm">
                            <i class="fa-solid fa-briefcase text-slate-400 text-xs"></i>
                        </div>
                        <p class="text-xs text-slate-700 font-semibold mb-0.5">Belum ada tugas.</p>
                        <p class="text-[10px] text-slate-400">Tulis tugas di atas untuk mulai melacak.</p>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <footer class="w-full text-center py-6 text-[10px] text-slate-400/80 border-t border-slate-200/40">
        <p>© 2026 Podomoro. Dibuat dengan cinta untuk produktivitas Anda.</p>
    </footer>

</body>
</html>
