<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pomodoro Timer Premium</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght=300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #090d16;
        }
        .glass {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        .glass-dark {
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .theme-pomodoro {
            background: radial-gradient(circle at top, #3b0712, #0f0507) !important;
        }
        .theme-short {
            background: radial-gradient(circle at top, #022c22, #020f0b) !important;
        }
        .theme-long {
            background: radial-gradient(circle at top, #031e3b, #020813) !important;
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
    </style>
</head>
<body class="min-h-screen overflow-x-hidden antialiased bg-[#090d16]">

    <div id="app-root" class="theme-pomodoro min-h-screen text-slate-100 flex flex-col justify-between transition-all duration-500 ease-in-out">
        
        <header class="w-full max-w-5xl mx-auto px-6 py-5 flex justify-between items-center z-10">
            <div class="flex items-center gap-2.5">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-rose-500 to-orange-500 flex items-center justify-center shadow-lg shadow-rose-900/30">
                    <i class="fa-regular fa-clock text-xl text-white animate-pulse"></i>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white to-slate-300 bg-clip-text text-transparent">Podomoro.</span>
            </div>
            <div class="flex items-center gap-3">
                <button id="btn-stats" class="w-10 h-10 rounded-xl glass hover:bg-white/20 transition-all duration-300 flex items-center justify-center text-slate-200" title="Statistik">
                    <i class="fa-solid fa-chart-simple"></i>
                </button>
                <button id="btn-settings" class="w-10 h-10 rounded-xl glass hover:bg-white/20 transition-all duration-300 flex items-center justify-center text-slate-200" title="Pengaturan">
                    <i class="fa-solid fa-sliders"></i>
                </button>
            </div>
        </header>

        <main class="w-full max-w-5xl mx-auto px-4 py-6 flex-grow flex flex-col lg:flex-row gap-8 items-center justify-center">
            
            <div class="w-full lg:w-3/5 flex flex-col items-center">
                <div class="glass p-1.5 rounded-2xl flex gap-1 mb-8 w-full max-w-md shadow-2xl">
                    <button id="mode-pomodoro" class="flex-1 py-3 px-2 rounded-xl text-xs md:text-sm font-semibold transition-all duration-300 bg-rose-500/20 text-rose-300 border border-rose-500/30 shadow-sm shadow-rose-950/20">
                        🍅 Pomodoro
                    </button>
                    <button id="mode-short" class="flex-1 py-3 px-2 rounded-xl text-xs md:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white border border-transparent">
                        ☕ Short Break
                    </button>
                    <button id="mode-long" class="flex-1 py-3 px-2 rounded-xl text-xs md:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white border border-transparent">
                        🌴 Long Break
                    </button>
                </div>

                <div class="relative w-72 h-72 md:w-80 md:h-80 flex items-center justify-center mb-10">
                    <svg class="absolute inset-0 w-full h-full -rotate-90">
                        <circle cx="50%" cy="50%" r="45%" stroke="rgba(255,255,255,0.04)" stroke-width="8" fill="transparent" />
                        <circle id="progress-bar" cx="50%" cy="50%" r="45%" stroke="url(#gradient-pomo)" stroke-width="8" fill="transparent" 
                                stroke-dasharray="848" stroke-dashoffset="0" stroke-linecap="round" class="transition-all duration-200" />
                        <defs>
                            <linearGradient id="gradient-pomo" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#f43f5e" />
                                <stop offset="100%" stop-color="#fb7185" />
                            </linearGradient>
                        </defs>
                    </svg>

                    <div class="z-10 text-center">
                        <span id="time-display" class="text-6xl md:text-7xl font-extrabold tracking-tight tabular-nums block drop-shadow-xl text-white">25:00</span>
                        <span id="timer-state-label" class="text-xs uppercase tracking-widest font-semibold text-rose-400/80 mt-2 block">Masa Fokus</span>
                    </div>
                </div>

                <div class="flex items-center gap-4 mb-6">
                    <button id="btn-reset" class="w-14 h-14 rounded-2xl glass hover:bg-white/20 text-xl transition-all duration-300 flex items-center justify-center text-slate-300 hover:text-white" title="Reset">
                        <i class="fa-solid fa-arrow-rotate-left"></i>
                    </button>
                    <button id="btn-start" class="px-10 py-5 rounded-2xl bg-rose-500 hover:bg-rose-400 hover:scale-105 active:scale-95 font-bold text-lg md:text-xl shadow-xl shadow-rose-500/20 text-white transition-all duration-300 flex items-center gap-3">
                        <i class="fa-solid fa-play"></i> <span>Mulai</span>
                    </button>
                    <button id="btn-skip" class="w-14 h-14 rounded-2xl glass hover:bg-white/20 text-xl transition-all duration-300 flex items-center justify-center text-slate-300 hover:text-white" title="Lewati Sesi">
                        <i class="fa-solid fa-forward"></i>
                    </button>
                </div>
            </div>

            <div class="w-full lg:w-2/5 flex flex-col gap-6">
                <div class="glass rounded-3xl p-6 shadow-2xl flex flex-col h-[380px]">
                    <div class="flex justify-between items-center mb-4">
                        <div class="flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-rose-400"></i>
                            <h2 class="text-lg font-bold">Daftar Tugas</h2>
                        </div>
                        <span id="task-count" class="text-xs bg-white/10 text-slate-300 py-1 px-2.5 rounded-full">0 selesai</span>
                    </div>

                    <form id="form-task" class="flex gap-2 mb-4">
                        <input type="text" id="input-task" placeholder="Apa fokus Anda berikutnya?" 
                               class="flex-1 bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-rose-500/50 placeholder:text-slate-500 transition-all text-white">
                        <button type="submit" class="bg-white/10 hover:bg-white/20 active:scale-95 transition-all text-white w-12 rounded-xl flex items-center justify-center">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>

                    <div id="list-task" class="flex-grow overflow-y-auto pr-1 space-y-2">
                        <div id="task-empty-state" class="h-full flex flex-col items-center justify-center text-center text-slate-400/80 p-4">
                            <div class="w-12 h-12 rounded-full border border-dashed border-white/20 flex items-center justify-center mb-2.5">
                                <i class="fa-solid fa-clipboard text-slate-500"></i>
                            </div>
                            <p class="text-sm">Belum ada tugas.</p>
                        </div>
                    </div>
                </div>
            </div>

        </main>

        <footer class="w-full max-w-5xl mx-auto px-6 py-6 text-center text-xs text-slate-500 border-t border-white/5 mt-8">
            <p>© 2026 Podomoro. Dibuat dengan cinta untuk produktivitas Anda.</p>
        </footer>
    </div>

    <div id="modal-settings" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 transition-all duration-300 opacity-0">
        <div class="glass-dark w-full max-w-md rounded-3xl p-6 shadow-2xl relative border border-white/10 text-slate-200">
            <button id="close-settings" class="absolute top-5 right-5 text-slate-400 hover:text-white transition-all text-lg"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fa-solid fa-sliders text-rose-500"></i> Pengaturan Waktu (Menit)</h3>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">🍅 Pomodoro</label>
                    <input type="number" id="set-pomodoro" min="1" max="120" value="25" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-rose-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">☕ Short Break</label>
                    <input type="number" id="set-short" min="1" max="60" value="5" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">🌴 Long Break</label>
                    <input type="number" id="set-long" min="1" max="60" value="15" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-sky-500">
                </div>
            </div>
            <button id="save-settings" class="w-full py-3 bg-white hover:bg-slate-100 transition-all text-slate-950 font-bold rounded-xl active:scale-95">Simpan & Terapkan</button>
        </div>
    </div>

    <div id="modal-stats" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden items-center justify-center p-4 transition-all duration-300 opacity-0">
        <div class="glass-dark w-full max-w-md rounded-3xl p-6 shadow-2xl relative border border-white/10 text-slate-200">
            <button id="close-stats" class="absolute top-5 right-5 text-slate-400 hover:text-white transition-all text-lg"><i class="fa-solid fa-xmark"></i></button>
            <h3 class="text-xl font-bold mb-6 flex items-center gap-2"><i class="fa-solid fa-chart-simple text-amber-500"></i> Statistik Anda</h3>
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                    <span id="stat-completed" class="block text-3xl font-extrabold text-rose-400">0</span>
                    <span class="text-xs text-slate-400 mt-1 block">Sesi Selesai</span>
                </div>
                <div class="bg-white/5 p-4 rounded-2xl border border-white/5 text-center">
                    <span id="stat-minutes" class="block text-3xl font-extrabold text-emerald-400">0m</span>
                    <span class="text-xs text-slate-400 mt-1 block">Waktu Fokus</span>
                </div>
            </div>
            <button id="reset-stats" class="w-full py-3 bg-rose-500/10 hover:bg-rose-500/20 text-rose-400 rounded-xl border border-rose-500/20 font-semibold active:scale-95">Reset Statistik</button>
        </div>
    </div>

    <script>
        let currentMode = 'pomodoro', isRunning = false, timerInterval = null, totalSeconds = 25 * 60, originalSeconds = 25 * 60;
        let settings = { pomodoro: 25, short: 5, long: 15 }, stats = { completedSessions: 0, focusedMinutes: 0 }, tasks = [];
        const appRoot = document.getElementById('app-root'), timeDisplay = document.getElementById('time-display'), timerStateLabel = document.getElementById('timer-state-label'), progressBar = document.getElementById('progress-bar'), btnStart = document.getElementById('btn-start'), btnReset = document.getElementById('btn-reset'), btnSkip = document.getElementById('btn-skip'), modePomoBtn = document.getElementById('mode-pomodoro'), modeShortBtn = document.getElementById('mode-short'), modeLongBtn = document.getElementById('mode-long'), btnSettings = document.getElementById('btn-settings'), modalSettings = document.getElementById('modal-settings'), closeSettings = document.getElementById('close-settings'), saveSettings = document.getElementById('save-settings'), btnStats = document.getElementById('btn-stats'), modalStats = document.getElementById('modal-stats'), closeStats = document.getElementById('close-stats'), resetStats = document.getElementById('reset-stats'), formTask = document.getElementById('form-task'), inputTask = document.getElementById('input-task'), listTask = document.getElementById('list-task'), taskEmptyState = document.getElementById('task-empty-state'), taskCountSpan = document.getElementById('task-count');

        function loadData() {
            const se = localStorage.getItem('p_set'), st = localStorage.getItem('p_sta'), ta = localStorage.getItem('p_tsk');
            if(se) { settings = JSON.parse(se); document.getElementById('set-pomodoro').value = settings.pomodoro; document.getElementById('set-short').value = settings.short; document.getElementById('set-long').value = settings.long; }
            if(st) { stats = JSON.parse(st); updateStatsUI(); }
            if(ta) { tasks = JSON.parse(ta); renderTasks(); }
        }
        function playBeep(t='success') {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator(), g = ctx.createGain(); osc.connect(g); g.connect(ctx.destination);
                if(t==='success') { osc.frequency.setValueAtTime(523, ctx.currentTime); g.gain.setValueAtTime(0.2, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.4); osc.start(); osc.stop(ctx.currentTime+0.4); }
                else { osc.frequency.setValueAtTime(800, ctx.currentTime); g.gain.setValueAtTime(0.05, ctx.currentTime); g.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime+0.05); osc.start(); osc.stop(ctx.currentTime+0.05); }
            }catch(e){}
        }
        function setTimeForMode() {
            let m = settings[currentMode];
            timerStateLabel.textContent = currentMode === 'pomodoro' ? "Masa Fokus" : (currentMode === 'short' ? "Istirahat Pendek" : "Istirahat Panjang");
            timerStateLabel.className = `text-xs uppercase tracking-widest font-semibold text-${currentMode==='pomodoro'?'rose':(currentMode==='short'?'emerald':'sky')}-400/80 mt-2 block`;
            updateProgressGradient(currentMode==='pomodoro'?'#f43f5e':(currentMode==='short'?'#10b981':'#0ea5e9'), currentMode==='pomodoro'?'#fb7185':(currentMode==='short'?'#34d399':'#38bdf8'));
            totalSeconds = m * 60; originalSeconds = totalSeconds; updateDisplay(); updateProgress();
        }
        function updateProgressGradient(c1, c2) {
            document.querySelector('#gradient-pomo stop:first-child').setAttribute('stop-color', c1);
            document.querySelector('#gradient-pomo stop:last-child').setAttribute('stop-color', c2);
        }
        function updateDisplay() {
            let m = String(Math.floor(totalSeconds / 60)).padStart(2,'0'), s = String(totalSeconds % 60).padStart(2,'0');
            timeDisplay.textContent = `${m}:${s}`;
        }
        function updateProgress() {
            let o = 848 - ((totalSeconds / originalSeconds) * 848);
            progressBar.setAttribute('stroke-dashoffset', isNaN(o) ? 0 : o);
        }
        function updateStartButtonStyles() {
            btnStart.className = "px-10 py-5 rounded-2xl font-bold text-lg md:text-xl shadow-xl transition-all duration-300 flex items-center gap-3 active:scale-95 hover:scale-105";
            if (isRunning) { btnStart.innerHTML = `<i class="fa-solid fa-pause"></i> <span>Jeda</span>`; btnStart.classList.add('bg-white/10', 'text-white'); }
            else { btnStart.innerHTML = `<i class="fa-solid fa-play"></i> <span>Mulai</span>`; btnStart.classList.add(currentMode==='pomodoro'?'bg-rose-500':(currentMode==='short'?'bg-emerald-500':'bg-sky-500'), 'text-white'); }
        }
        function startTimer() {
            if (isRunning) return; isRunning = true; updateStartButtonStyles();
            timerInterval = setInterval(() => {
                if (totalSeconds > 0) { totalSeconds--; updateDisplay(); updateProgress(); }
                else { clearInterval(timerInterval); isRunning = false; playBeep('success'); if(currentMode==='pomodoro') { stats.completedSessions++; stats.focusedMinutes+=settings.pomodoro; localStorage.setItem('p_sta', JSON.stringify(stats)); updateStatsUI(); setMode('short'); } else { setMode('pomodoro'); } }
            }, 1000);
        }
        function pauseTimer() { isRunning = false; clearInterval(timerInterval); updateStartButtonStyles(); }
        function setMode(m) {
            playBeep('click'); pauseTimer(); currentMode = m;
            [modePomoBtn, modeShortBtn, modeLongBtn].forEach(b => b.className = "flex-1 py-3 px-2 rounded-xl text-xs md:text-sm font-semibold transition-all duration-300 text-slate-400 hover:text-white border border-transparent");
            document.getElementById(`mode-${m}`).className = `flex-1 py-3 px-2 rounded-xl text-xs md:text-sm font-semibold transition-all duration-300 bg-${m==='pomodoro'?'rose':(m==='short'?'emerald':'sky')}-500/20 text-${m==='pomodoro'?'rose':(m==='short'?'emerald':'sky')}-300 border border-${m==='pomodoro'?'rose':(m==='short'?'emerald':'sky')}-500/30`;
            appRoot.className = `theme-${m} min-h-screen text-slate-100 flex flex-col justify-between transition-all duration-500 ease-in-out`;
            setTimeForMode(); updateStartButtonStyles();
        }
        formTask.addEventListener('submit', (e) => {
            e.preventDefault(); const t = inputTask.value.trim(); if (!t) return;
            tasks.push({ id: Date.now().toString(), text: t, completed: false });
            localStorage.setItem('p_tsk', JSON.stringify(tasks)); inputTask.value = ''; renderTasks(); playBeep('click');
        });
        window.toggleTask = function(id) { tasks = tasks.map(t => { if(t.id===id) t.completed=!t.completed; return t; }); localStorage.setItem('p_tsk', JSON.stringify(tasks)); renderTasks(); playBeep('click'); }
        window.deleteTask = function(id) { tasks = tasks.filter(t => t.id!==id); localStorage.setItem('p_tsk', JSON.stringify(tasks)); renderTasks(); playBeep('click'); }
        function renderTasks() {
            tasks.sort((a,b) => a.completed - b.completed);
            listTask.innerHTML = tasks.map(t => `
                <div class="flex items-center justify-between p-3.5 rounded-xl glass hover:bg-white/15 transition-all group ${t.completed ? 'opacity-60 line-through text-slate-400' : ''}">
                    <div class="flex items-center gap-3 flex-1 cursor-pointer" onclick="toggleTask('${t.id}')">
                        <div class="w-5 h-5 rounded-md border ${t.completed ? 'bg-emerald-500 border-emerald-500' : 'border-white/30'} flex items-center justify-center">
                            ${t.completed ? '<i class="fa-solid fa-check text-[10px] text-slate-950 font-bold"></i>' : ''}
                        </div>
                        <span class="text-sm font-medium break-all max-w-[200px]">${t.text}</span>
                    </div>
                    <button onclick="deleteTask('${t.id}')" class="text-slate-400 hover:text-rose-400 md:opacity-0 group-hover:opacity-100 p-1"><i class="fa-solid fa-trash-can"></i></button>
                </div>
            `).join('');
            tasks.length > 0 ? taskEmptyState.classList.add('hidden') : taskEmptyState.classList.remove('hidden');
            taskCountSpan.textContent = `${tasks.filter(t => t.completed).length} selesai`;
        }
        function updateStatsUI() { document.getElementById('stat-completed').textContent = stats.completedSessions; document.getElementById('stat-minutes').textContent = `${stats.focusedMinutes}m`; }
        function oM(m) { m.classList.remove('hidden'); m.classList.add('flex'); setTimeout(() => m.classList.replace('opacity-0', 'opacity-100'), 10); }
        function cM(m) { m.classList.replace('opacity-100', 'opacity-0'); setTimeout(() => { m.classList.remove('flex'); m.classList.add('hidden'); }, 300); }
        
        btnStart.addEventListener('click', () => { playBeep('click'); isRunning ? pauseTimer() : startTimer(); });
        btnReset.addEventListener('click', () => { playBeep('click'); pauseTimer(); setTimeForMode(); });
        btnSkip.addEventListener('click', () => { setMode(currentMode === 'pomodoro' ? 'short' : 'pomodoro'); });
        modePomoBtn.addEventListener('click', () => setMode('pomodoro'));
        modeShortBtn.addEventListener('click', () => setMode('short'));
        modeLongBtn.addEventListener('click', () => setMode('long'));
        btnSettings.addEventListener('click', () => oM(modalSettings));
        closeSettings.addEventListener('click', () => cM(modalSettings));
        saveSettings.addEventListener('click', () => {
            settings.pomodoro = Math.max(1, parseInt(document.getElementById('set-pomodoro').value)||25);
            settings.short = Math.max(1, parseInt(document.getElementById('set-short').value)||5);
            settings.long = Math.max(1, parseInt(document.getElementById('set-long').value)||15);
            localStorage.setItem('p_set', JSON.stringify(settings)); setTimeForMode(); cM(modalSettings); playBeep('success');
        });
        btnStats.addEventListener('click', () => oM(modalStats));
        closeStats.addEventListener('click', () => cM(modalStats));
        resetStats.addEventListener('click', () => { if(confirm("Reset statistik?")) { stats={completedSessions:0,focusedMinutes:0}; localStorage.setItem('p_sta',JSON.stringify(stats)); updateStatsUI(); cM(modalStats); } });
        window.onload = () => { loadData(); setTimeForMode(); updateStartButtonStyles(); };
    </script>
</body>
</html>
